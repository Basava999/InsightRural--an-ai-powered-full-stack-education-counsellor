<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsightRural | KCET AI Search</title>
    <!-- Fonts: Outfit for sleek modern headings, Inter for readable text -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="landing-mode">

    <!-- Background Orbs for Premium Aesthetics -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <!-- Top Navigation (Visible mostly in Search Mode, but logo shifts) -->
    <nav class="top-nav">
        <div class="nav-logo" id="navLogo">
            <i class="fas fa-graduation-cap logo-icon"></i>
            <span class="logo-text">Insight<span class="highlight">Rural</span></span>
        </div>
        
        <div class="search-container" id="searchContainer">
            <div class="search-bar">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" placeholder="Ask about colleges, cutoffs, fees, or rankings..." autocomplete="off">
                <button class="clear-btn" id="clearBtn"><i class="fas fa-times"></i></button>
                <button class="voice-btn" id="voiceBtn"><i class="fas fa-microphone"></i></button>
            </div>
            <div class="search-suggestions glass-panel hidden" id="searchSuggestions">
                <!-- Suggestions injected here -->
            </div>
        </div>

        <div class="nav-actions">
            <button class="glass-btn"><i class="fas fa-compass"></i> Explore</button>
            <button class="glass-btn primary"><i class="fas fa-user-graduate"></i> My Profile</button>
        </div>
    </nav>

    <!-- Landing Center Content (Fades out in search mode) -->
    <main class="landing-center" id="landingCenter">
        <div class="hero-logo">
            <i class="fas fa-graduation-cap hero-icon"></i>
            <h1>Insight<span class="highlight">Rural</span></h1>
            <p class="tagline">The world's most accurate KCET counseling engine.</p>
        </div>
        
        <!-- The search bar is visually detached from the nav in landing mode via CSS -->
        
        <div class="quick-chips">
            <button class="chip">Top CSE Colleges in Bangalore</button>
            <button class="chip">Colleges under 50k rank</button>
            <button class="chip">Fee structure for RVCE</button>
            <button class="chip">Best Placement Colleges</button>
        </div>
    </main>

    <!-- Search Engine Results Page (SERP) Content (Hidden in landing mode) -->
    <main class="serp-content hidden" id="serpContent">
        
        <div class="results-layout">
            <!-- Left Column: Main Results -->
            <div class="main-column">
                
                <!-- AI Featured Snippet -->
                <div class="ai-overview-card glass-panel hidden" id="aiOverview">
                    <div class="ai-header">
                        <i class="fas fa-sparkles ai-icon"></i>
                        <span>AI Overview</span>
                    </div>
                    <div class="ai-content" id="aiContent">
                        <div class="typing-indicator hidden" id="aiLoading">
                            <span></span><span></span><span></span>
                        </div>
                        <div id="aiText" class="markdown-body"></div>
                    </div>
                    <div class="ai-footer">
                        <span class="confidence high"><i class="fas fa-check-circle"></i> High Confidence (Grounded in OKF Database)</span>
                    </div>
                </div>

                <!-- Structured Results Header -->
                <div class="results-stats" id="resultsStats">
                    <!-- e.g. "Showing 12 verified colleges (0.24 seconds)" -->
                </div>

                <!-- Structured College Cards Container -->
                <div class="results-grid" id="resultsGrid">
                    <!-- Cards injected here -->
                </div>
            </div>

            <!-- Right Column: Filters / Knowledge Panel -->
            <div class="side-column">
                <div class="filters-panel glass-panel">
                    <h3>Filters</h3>
                    
                    <div class="filter-group">
                        <label>Location</label>
                        <select id="filterLocation" class="glass-select">
                            <option value="">All Regions</option>
                            <option value="Bangalore">Bangalore</option>
                            <option value="Mysore">Mysore</option>
                            <option value="Mangalore">Mangalore</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>College Type</label>
                        <select id="filterType" class="glass-select">
                            <option value="">All Types</option>
                            <option value="Government">Government</option>
                            <option value="Private">Private</option>
                            <option value="Autonomous">Autonomous</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>Max Fee (Annual)</label>
                        <input type="range" id="filterFee" min="0" max="500000" step="10000" class="glass-range">
                        <div class="range-val" id="feeVal">Any</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Templates for JS injection -->
    <template id="collegeCardTemplate">
        <div class="college-card glass-panel">
            <div class="card-header">
                <div class="c-title">
                    <h3 class="c-name"></h3>
                    <span class="c-code badge"></span>
                </div>
                <div class="c-type badge-type"></div>
            </div>
            <div class="card-body">
                <p class="c-location"><i class="fas fa-map-marker-alt"></i> <span></span></p>
                <div class="c-metrics">
                    <div class="metric">
                        <span class="m-label">NAAC</span>
                        <span class="m-value naac-val"></span>
                    </div>
                    <div class="metric">
                        <span class="m-label">Highest LPA</span>
                        <span class="m-value lpa-val"></span>
                    </div>
                    <div class="metric">
                        <span class="m-label">Hostel</span>
                        <span class="m-value hostel-val"></span>
                    </div>
                </div>
            </div>
            <div class="card-footer">
                <button class="btn-text">View Full Details <i class="fas fa-arrow-right"></i></button>
            </div>
        </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
